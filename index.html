<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Join Our Telegram Channel</title>
  <meta name="description" content="Join our Telegram channel today.">

  <!-- META PIXEL CODE -->
  <script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');

  // Disable automatic event detection
  fbq('set', 'autoConfig', false, '1437109641824579');

  // Initialize Pixel
  fbq('init', '1437109641824579');

  // Keep PageView active
  fbq('track', 'PageView');
  </script>

  <noscript>
    <img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1437109641824579&ev=PageView&noscript=1"/>
  </noscript>
  <!-- END META PIXEL CODE -->

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #07111f;
      font-family: Arial, sans-serif;
      color: #ffffff;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 410px;
      text-align: center;
      background: #111f32;
      padding: 40px 25px;
      border-radius: 18px;
      border: 1px solid #263b55;
    }

    .telegram-icon {
      font-size: 55px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    p {
      color: #b9c6d8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .join-btn {
      display: block;
      width: 100%;
      padding: 17px;
      border-radius: 10px;
      background: #229ED9;
      color: white;
      font-size: 17px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .join-btn:hover {
      background: #168ac2;
    }

    .join-btn:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .footer {
      margin-top: 22px;
      font-size: 12px;
      color: #8293a8;
    }

    #status {
      margin-top: 15px;
      color: #ffb4b4;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="telegram-icon">✈️</div>

    <h1>Join Our Telegram</h1>

    <p>
      Click the button below to join our
      private Telegram channel.
    </p>

    <button class="join-btn" id="joinTelegram">
      JOIN TELEGRAM
    </button>

    <div id="status"></div>

    <div class="footer">
      Connect with us on Telegram
    </div>

  </div>

  <script>
    function getCookie(name) {
      const match = document.cookie.match(
        new RegExp('(?:^|; )' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '=([^;]*)')
      );

      return match ? decodeURIComponent(match[1]) : null;
    }

    const button = document.getElementById("joinTelegram");
    const status = document.getElementById("status");

    button.addEventListener("click", async function () {

      if (button.disabled) return;

      button.disabled = true;
      button.textContent = "PLEASE WAIT...";
      status.textContent = "";

      try {
        const response = await fetch("/api/create-invite", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            fbp: getCookie("_fbp"),
            fbc: getCookie("_fbc")
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success || !data.invite_link) {
          throw new Error(data.error || "Invite link could not be created.");
        }

        window.location.href = data.invite_link;

      } catch (error) {
        console.error("Telegram invite error:", error);

        status.textContent =
          "Unable to connect right now. Please try again.";

        button.disabled = false;
        button.textContent = "JOIN TELEGRAM";
      }

    });
  </script>

</body>
</html>
